<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>My Gym Coach</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f5f7f9;background:#101820}*{box-sizing:border-box}body{margin:0;padding:20px 14px 95px;max-width:680px;margin:auto}h1{font-size:26px;margin:8px 0}h2{font-size:19px}small,.muted{color:#9eacb6}.card{background:#1d2933;border:1px solid #33414c;border-radius:17px;padding:16px;margin:12px 0}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0}.tabs button{white-space:nowrap}.btn,button{border:0;border-radius:11px;padding:11px 13px;background:#344652;color:white;font-weight:650;cursor:pointer}.primary{background:#39bd91;color:#091b16}.active{background:#39bd91;color:#09251c}input,select{background:#111c25;color:white;border:1px solid #52616b;border-radius:9px;padding:10px;width:100%;font-size:16px}label{display:block;font-size:13px;color:#b4c0c9;margin-bottom:5px}.sets{display:grid;grid-template-columns:35px 1fr 1fr 46px;gap:8px;align-items:center;margin:8px 0}.sets input{text-align:center;min-width:0}.exercise{border-top:1px solid #384651;padding-top:14px;margin-top:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-block;background:#2c403c;color:#9ee4cd;border-radius:20px;padding:5px 10px;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#111d26;border-top:1px solid #33434c;display:flex;justify-content:space-around;padding:11px 4px max(12px,env(safe-area-inset-bottom))}.bottom button{background:transparent;font-size:13px}.bottom button.active{color:#45d7a2} .hidden{display:none}.hint{font-size:13px;color:#a9bac4;line-height:1.7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0} .danger{background:#65383c}a{color:#79dcb8}</style></head><body><header><small>تطبيقك الشخصي • بدون حساب أو اشتراك</small><h1>💪 My Gym Coach</h1><div class="row"><span class="pill">هدفك: خسارة دهون + زيادة عضل</span><span class="muted">85 كجم • 5 أيام</span></div></header><main id="main"><div class="card"><strong>جدولك الأسبوعي</strong><p>لو التمارين مش ظاهرة هنا، افتح الملف في Safari بدل معاينة ChatGPT؛ المعاينة ممكن تمنع تشغيل التطبيق.</p><p>السبت: Upper • الأحد: Lower A • الثلاثاء: Push • الأربعاء: Pull • الخميس: Lower B</p></div></main><nav class="bottom"><button onclick="page('today')" id="nav-today">🏋️ التمرين</button><button onclick="page('history')" id="nav-history">📈 السجل</button><button onclick="page('body')" id="nav-body">⚖️ الجسم</button><button onclick="page('settings')" id="nav-settings">⚙️ البيانات</button></nav><script>
const plan=[{name:'Upper',ar:'صدر + ظهر + كتف + ذراع',cardio:'10 دقائق مشي مائل',ex:[['Barbell Bench Press',3,'6–8'],['Lat Pulldown',3,'8–12'],['Incline Dumbbell Press',3,'8–12'],['Seated Cable Row',3,'8–12'],['Dumbbell Lateral Raise',3,'12–15'],['Cable Triceps Pushdown',2,'10–15'],['Dumbbell Biceps Curl',2,'10–15']]},{name:'Lower A',ar:'رجل + بطن',cardio:'10 دقائق دراجة',ex:[['Squat / Hack Squat',3,'6–10'],['Romanian Deadlift',3,'8–10'],['Leg Press',3,'10–12'],['Seated Leg Curl',3,'10–15'],['Standing Calf Raise',3,'12–15'],['Cable Crunch',3,'12–15']]},{name:'Push',ar:'صدر + كتف + ترايسبس',cardio:'15 دقيقة مشي مائل',ex:[['Incline Smith Machine Press',3,'8–10'],['Machine Chest Press',3,'10–12'],['Seated Dumbbell Shoulder Press',3,'8–12'],['Cable Lateral Raise',3,'12–20'],['Cable Chest Fly',2,'12–15'],['Overhead Cable Triceps Extension',3,'10–15']]},{name:'Pull',ar:'ظهر + بايسبس',cardio:'15 دقيقة دراجة أو مشي',ex:[['Assisted Pull-Up / Lat Pulldown',3,'8–12'],['Chest-Supported Row',3,'8–12'],['Single-Arm Cable Row',2,'10–12'],['Reverse Pec Deck',3,'12–20'],['Incline Dumbbell Curl',3,'10–12'],['Hammer Curl',2,'10–15']]},{name:'Lower B',ar:'رجل + بطن',cardio:'10 دقائق مشي خفيف',ex:[['Hack Squat / Front Squat',3,'8–12'],['Hip Thrust',3,'8–12'],['Lying Leg Curl',3,'10–15'],['Bulgarian Split Squat',2,'10 لكل رجل'],['Seated Calf Raise',3,'12–20'],['Hanging Knee Raise',3,'10–15'],['Plank',2,'30–60 ثانية']]}];
const key='mygymcoach_v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{sessions:[],body:[],drafts:{},day:0}}catch(e){db={sessions:[],body:[],drafts:{},day:0}};const save=()=>{try{localStorage.setItem(key,JSON.stringify(db))}catch(e){console.warn('Storage unavailable',e)}};const el=document.getElementById('main');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current='today';function page(p){current=p;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+p));({today,history,body,settings})[p]()}function last(name){for(let i=db.sessions.length-1;i>=0;i--){let x=db.sessions[i].ex.find(x=>x.name===name);if(x)return x}return null}function draft(day){if(!db.drafts[day]){db.drafts[day]=plan[day].ex.map(([name,count])=>({name,sets:Array.from({length:count},(_,i)=>{let old=last(name)?.sets[i];return {kg:old?.kg??'',reps:'',done:false}})}));save()}return db.drafts[day]}
function today(){let d=db.day;el.innerHTML=`<div class="card"><label>اختار يوم التمرين</label><div class="tabs">${plan.map((x,i)=>`<button class="${d===i?'active':''}" onclick="choose(${i})">${i+1}. ${x.name}</button>`).join('')}</div><h2>${plan[d].name} — ${plan[d].ar}</h2><p class="hint">سخّن 5 دقائق، وابدأ بمجموعات إحماء للتمرين الأساسي. سجّل الوزن بالكيلو والتكرارات لكل مجموعة. اضغط ✓ بعد إنهائها.</p></div>${draft(d).map((x,i)=>`<section class="card"><div class="row"><strong>${i+1}. ${esc(x.name)}</strong><span class="pill">${plan[d].ex[i][2]}</span></div><p class="hint">آخر أداء: ${last(x.name)?last(x.name).sets.map(s=>`${s.kg}ك × ${s.reps}`).join(' | '):'أول مرة'}</p><div class="sets"><small>مج</small><small>الوزن (كجم)</small><small>التكرارات</small><small>تم</small></div>${x.sets.map((s,j)=>`<div class="sets"><span>${j+1}</span><input type="number" min="0" step="0.5" value="${esc(s.kg)}" aria-label="وزن المجموعة ${j+1}" oninput="edit(${i},${j},'kg',this.value)"><input type="number" min="0" step="1" value="${esc(s.reps)}" aria-label="تكرارات المجموعة ${j+1}" oninput="edit(${i},${j},'reps',this.value)"><input type="checkbox" ${s.done?'checked':''} onchange="edit(${i},${j},'done',this.checked)" aria-label="إنهاء المجموعة ${j+1}"></div>`).join('')}</section>`).join('')}<div class="card"><strong>🚶 الكارديو</strong><p>${plan[d].cardio}</p><button class="primary" style="width:100%" onclick="finish()">إنهاء وحفظ التمرين ✓</button></div>`}function choose(i){db.day=i;save();today()}function edit(i,j,k,v){draft(db.day)[i].sets[j][k]=v;save()}function finish(){let ex=draft(db.day);if(!ex.some(x=>x.sets.some(s=>s.done))){alert('علّم على مجموعة واحدة على الأقل قبل الحفظ');return}db.sessions.push({date:new Date().toISOString(),day:db.day,ex:JSON.parse(JSON.stringify(ex))});delete db.drafts[db.day];db.day=(db.day+1)%5;save();alert('تم حفظ التمرين بنجاح!');page('history')}
function history(){let s=[...db.sessions].reverse();el.innerHTML=`<h2>📈 سجل التمارين</h2><div class="stats"><div class="card"><small>عدد الحصص</small><h2>${s.length}</h2></div><div class="card"><small>آخر حصة</small><h2>${s.length?new Date(s[0].date).toLocaleDateString('ar-EG'):'—'}</h2></div></div>${s.length?s.map((x,i)=>`<details class="card"><summary><strong>${plan[x.day].name}</strong> — ${new Date(x.date).toLocaleDateString('ar-EG')}</summary>${x.ex.map(z=>`<p><strong>${esc(z.name)}</strong><br><small>${z.sets.filter(t=>t.done).map(t=>`${esc(t.kg)} كجم × ${esc(t.reps)}`).join(' | ')||'غير مكتمل'}</small></p>`).join('')}</details>`).join(''):'<div class="card">أول ما تخلص تمرين هتلاقيه هنا.</div>'}`}
function body(){let b=[...db.body].reverse();el.innerHTML=`<h2>⚖️ متابعة الجسم</h2><div class="card"><label>الوزن الحالي (كجم)</label><input id="bw" type="number" step="0.1" placeholder="85"><label style="margin-top:12px">محيط الخصر (سم) — اختياري</label><input id="wa" type="number" step="0.1" placeholder="95"><button class="primary" style="width:100%;margin-top:12px" onclick="addBody()">حفظ القياس</button></div><div class="card"><strong>هدف التغذية المبدئي</strong><p>2300 سعرة • 170 جم بروتين • 70 جم دهون • 248 جم كربوهيدرات</p><small>عدّل السعرات بعد أسبوعين حسب متوسط الوزن ومحيط الخصر.</small></div><h2>القياسات السابقة</h2>${b.map(x=>`<div class="card row"><span>${new Date(x.date).toLocaleDateString('ar-EG')}</span><strong>${esc(x.weight)} كجم</strong><small>${x.waist?esc(x.waist)+' سم خصر':''}</small></div>`).join('')||'<p class="muted">لا توجد قياسات بعد</p>'}`}function addBody(){let w=document.getElementById('bw').value,wa=document.getElementById('wa').value;if(!w||Number(w)<=0){alert('اكتب وزنك');return}db.body.push({date:new Date().toISOString(),weight:w,waist:wa});save();body()}
function settings(){el.innerHTML=`<h2>⚙️ بياناتك وخصوصيتك</h2><div class="card"><p>كل بياناتك محفوظة محليًا في متصفح الجهاز. لا يوجد إرسال بيانات أو تسجيل حساب.</p><p class="hint">مهم: لو مسحت بيانات Safari أو استخدمت جهاز مختلف، ممكن تفقد السجل. نزّل نسخة احتياطية بانتظام.</p><button class="primary" onclick="backup()">⬇️ تصدير نسخة احتياطية JSON</button><p><label>استعادة نسخة احتياطية</label><input type="file" accept="application/json,.json" onchange="restore(this)"></p></div><div class="card"><button class="danger" onclick="clearAll()">مسح كل البيانات</button></div>`}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-gym-coach-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x.sessions)||!Array.isArray(x.body))throw Error();if(confirm('استبدال بيانات التطبيق بالنسخة الاحتياطية؟')){db=x;db.drafts??={};db.day??=0;save();page('today')}}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}})}function clearAll(){if(confirm('هل أنت متأكد من مسح كل بيانات التمرين والقياسات؟')){localStorage.removeItem(key);location.reload()}}page('today');
</script></body></html>
